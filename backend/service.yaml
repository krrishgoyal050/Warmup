apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: travel-planner-backend
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    spec:
      containers:
        - image: gcr.io/your-project-id/travel-planner-backend:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 1Gi
              cpu: "1000m"
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
            # In production, fetch keys securely from Google Secret Manager
            - name: GEMINI_API_KEY
              value: "your-gemini-key"
            - name: GOOGLE_MAPS_API_KEY
              value: "your-google-maps-key"
            - name: FIREBASE_PROJECT_ID
              value: "your-firebase-project-id"
